<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PatiGo X - İstanbul çatılarında koş!</title>
    <meta name="description" content="Nox'la Kapalıçarşı'nın çatılarında koş, balık topla, engellerden kaç. Tarayıcıda hemen oyna.">
    <meta name="theme-color" content="#0a0e22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PatiGo X">
    <meta property="og:type" content="website">
    <meta property="og:title" content="PatiGo X - İstanbul çatılarında koş!">
    <meta property="og:description" content="Nox'la Kapalıçarşı'nın çatılarında koş, balık topla, engellerden kaç. Tarayıcıda hemen oyna.">
    <meta property="og:image" content="https://vodiapp34-cloud.github.io/patigox/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://vodiapp34-cloud.github.io/patigox/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0e22; }
      body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #game { position: relative; width: 100%; height: 100%; background: #0a0e22; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0a0e22; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        background: #0a0e22 url("bg.jpg") center / cover no-repeat; color: #fff; padding-bottom: 14%; box-sizing: border-box; }
      #loading::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,34,0.1) 0%, rgba(10,14,34,0.85) 75%); }
      #loading > * { position: relative; }
      #title { font-size: clamp(42px, 11vmin, 88px); font-weight: 900; color: #ffc24e; letter-spacing: 1px; text-shadow: 0 4px 0 #3a1a04, 0 0 24px rgba(255,140,30,.45); }
      #title span { color: #ff6a10; }
      #tag { margin: 6px 0 26px; font-size: clamp(14px, 3.4vmin, 22px); opacity: .9; }
      #bar { width: 62%; max-width: 420px; height: 16px; border-radius: 10px; background: rgba(255,255,255,.12); border: 2px solid #d9a441; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff8a1a, #ffc24e); transition: width .2s; }
      #hint { margin-top: 12px; font-size: 13px; opacity: .7; }
      #warning { position: absolute; left: 0; right: 0; top: 0; color: #fff; text-align: center; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div id="title">PatiGo <span>X</span></div>
        <div id="tag">İstanbul çatılarında koş!</div>
        <div id="bar"><div id="fill"></div></div>
        <div id="hint">Yükleniyor... İlk açılış biraz sürebilir.</div>
      </div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) document.body.className = "mobile";
      function unityShowBanner(msg, type) {
        if (type != 'error') return; // only real errors are shown
        var w = document.querySelector("#warning");
        w.style.background = '#a01818'; w.style.padding = '10px'; w.textContent = msg;
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/377eea7fa860944fd0a5fe2f50c8ca90.data.unityweb",
        frameworkUrl: buildUrl + "/e5f225420d3ebc145d807bee09d2c299.framework.js.unityweb",
        codeUrl: buildUrl + "/15c338baab02d072cbae3b530044a721.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "PatiGo",
        productName: "PatiGo X",
        productVersion: "0.9.1128.0345",
        showBanner: unityShowBanner,
        // Retina / phone screens: drawing at the full device pixel ratio meant 3-4x the pixels and freezes (owner 28 Nov).
        // 1.25 keeps the picture sharp while the GPU keeps up.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25),
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/d9fa50c66553e93ee4471cc10343df08.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          window.patigoInstance = instance;
        }).catch(function (message) { unityShowBanner(String(message), 'error'); });
      };
      document.body.appendChild(script);

      // In-game "PAYLAŞ" button (Results screen) calls this through the PatiGoShare plugin.
      window.patigoShare = function (text) {
        var url = "https://vodiapp34-cloud.github.io/patigox/";
        if (navigator.share) { navigator.share({ title: "PatiGo X", text: text, url: url }).catch(function () {}); return; }
        var full = text + " " + url;
        if (navigator.clipboard) navigator.clipboard.writeText(full).then(function () { unityShowBanner("", ""); });
        window.open("https://wa.me/?text=" + encodeURIComponent(full), "_blank");
      };
    </script>
  </body>
</html>
